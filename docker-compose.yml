
services:
  db:
    image: mariadb:10.6
    container_name: snipeit_db
    restart: unless-stopped
    environment:
    APP_KEY: base64:5RuXZD4CszLvd50GdYDfzmxJS90CLbp23R4kotb7a/4=
      MYSQL_ROOT_PASSWORD: Vic2025!   
      MYSQL_DATABASE: snipeit
      MYSQL_USER: admin
      MYSQL_PASSWORD: Vic2025!             
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  snipeit:
    image: snipe/snipe-it:latest
    container_name: snipeit_app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"   # obra http://localhost:8080
    environment:
      APP_DEBUG: 'false'
      APP_URL: http://localhost:8080
      # DB
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: snipeit
      DB_USERNAME: admin
      DB_PASSWORD: Vic2025!
      
      MAIL_DRIVER: smtp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: admin@gmail.com
      MAIL_FROM_NAME: "Snipe-IT"
    volumes:
      - snipe_uploads:/var/lib/snipeit/uploads
    restart: unless-stopped

volumes:
  db_data:
  snipe_uploads:
